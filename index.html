<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Colônia de Formigas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Simulador de Colônia de Formigas</h1>

    <section>
        <h2>Configurações</h2>

        <label>Número de formigas:</label>
        <input type="number" id="numeroFormigas" value="10">

        <label>Número de iterações:</label>
        <input type="number" id="numeroIteracoes" value="30">

        <label>Alfa:</label>
        <input type="number" id="alfa" value="1" step="0.1">

        <label>Beta:</label>
        <input type="number" id="beta" value="2" step="0.1">

        <label>Rho:</label>
        <input type="number" id="rho" value="0.5" step="0.1">

        <label>Tau inicial:</label>
        <input type="number" id="tau0" value="1" step="0.1">

        <label>Q:</label>
        <input type="number" id="Q" value="14">

        <label>Semente:</label>
        <input type="number" id="semente" value="42">
    </section>

    <section>
        <h2>Execução</h2>

        <button id="executar">Executar algoritmo</button>
        <button id="avancar">Avançar iteração</button>
        <button id="reiniciar">Reiniciar</button>
    </section>
    
    <section>
        <h2>Gerenciar vértices</h2>

        <label>ID:</label>
        <input type="text" id="idVertice" placeholder="Ex: E">

        <label>Coordenada X:</label>
        <input type="number" id="coordX">

        <label>Coordenada Y:</label>
        <input type="number" id="coordY">

        <button id="adicionarVertice">Adicionar vértice</button>

        <label>Selecionar vértice:</label>
        <select id="selecionarVertice"></select>

        <button id="editarVertice">Editar vértice</button>
        <button id="removerVertice">Remover vértice</button>
        <button id="definirDeposito">Definir como depósito</button>

        <div id="listaVertices"></div>
    </section>

    <section>
        <h2>Grafo</h2>
        <div id="grafo"></div>
    </section>

    <section>
        <h2>Melhor resultado</h2>
        <p id="melhorRota">Melhor rota: --</p>
        <p id="melhorDistancia">Distância: --</p>
        <p id="iteracao">Iteração: 0</p>
    </section>

    <section>
        <h2>Histórico</h2>
        <div id="historico"></div>
    </section>

    <section>
        <h2>Logs de execução</h2>
        <div id="logs"></div>
    </section>

    <script src="script.js"></script>

</body>
</html>
